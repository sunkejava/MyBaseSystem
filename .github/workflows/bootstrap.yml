name: Bootstrap MyBaseSystem
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and push MyBaseSystem
        shell: bash
        run: |
          cp mybasesystem.patch /tmp/mybasesystem.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add template https://github.com/tabtab-dev/ui.git
          git fetch --depth=1 template main
          git read-tree --reset -u template/main
          git apply --binary /tmp/mybasesystem.patch
          git add -A
          git commit -m "feat: initialize MyBaseSystem with .NET 10 DDD clean architecture"
          git push origin main
